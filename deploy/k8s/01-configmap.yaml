# ConfigMap：非敏感配置，等价于 docker-compose.yml 里 environment 的公开部分。
# 这些环境变量通过 Viper AutomaticEnv 覆盖镜像内 configs/config.yaml 的
# 127.0.0.1 开发默认值——和 compose 阶段用的是同一套机制，Go 代码零改动。
#
# MYSQL_HOST=mysql / GRPC_CLIENT_*_ADDR=user-service:9001 都是 Service 名：
# 容器网络里"Service 名即 DNS"，和 compose 的 service 名寻址一一对应。
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecom
data:
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DB_NAME: "ecom_admin"
  # product-service 读缓存（11-redis.yaml），Service 名即 DNS，同 MYSQL_HOST 机制
  REDIS_ADDR: "redis:6379"
  GRPC_CLIENT_USER_SERVICE_ADDR: "user-service:9001"
  GRPC_CLIENT_PRODUCT_SERVICE_ADDR: "product-service:9002"
  # order-service（阶段 3）：api-gateway 调它走这条；
  # order-service 自己调 product-service 复用上面那条 PRODUCT_SERVICE_ADDR——
  # 同一份 ConfigMap 同时被两边 envFrom 引用，这是设计好的复用。
  GRPC_CLIENT_ORDER_SERVICE_ADDR: "order-service:9003"
  # 消息中间件（阶段 6）：5.x gRPC 客户端连 Proxy 8081，Service 名即 DNS。
  # order-service 的 relay 投递端与 product-service 的消费端都走这条。
  ROCKETMQ_PROXY_ADDR: "rocketmq:8081"
